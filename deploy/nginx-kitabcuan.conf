# Nginx reverse proxy untuk KitabCuan (Next.js di port 3000)
# Pasang: sudo cp deploy/nginx-kitabcuan.conf /etc/nginx/sites-available/kitabcuan
#         sudo ln -s /etc/nginx/sites-available/kitabcuan /etc/nginx/sites-enabled/
#         sudo nginx -t && sudo systemctl reload nginx
# Ganti "DOMAIN.com" dengan domain kamu.

# HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name kitabcuan.org www.kitabcuan.org;
    return 301 https://$host$request_uri;
}

# HTTPS (pakai Cloudflare Origin Certificate -> SSL/TLS mode "Full (strict)")
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kitabcuan.org www.kitabcuan.org;

    # Cloudflare Origin Certificate (buat di Cloudflare -> SSL/TLS -> Origin Server)
    ssl_certificate     /etc/ssl/cloudflare/kitabcuan.pem;
    ssl_certificate_key /etc/ssl/cloudflare/kitabcuan.key;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
